services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geocredit
      POSTGRES_USER: geocredit
      POSTGRES_PASSWORD: geocredit
    ports: ["55432:5432"]
    volumes: ["geocredit-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocredit -d geocredit"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":59001"
    environment:
      MINIO_ROOT_USER: geocreditminio
      MINIO_ROOT_PASSWORD: geocreditminiosecret
    ports: ["59000:9000", "59001:59001"]
    volumes: ["geocredit-minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  geocredit-postgres:
  geocredit-minio:
